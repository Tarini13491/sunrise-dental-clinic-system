# Sunrise Dental Clinic — runtime configuration
# Copy this file if you need environment-specific values.

# Use 127.0.0.1 (TCP) rather than localhost — Connector/J treats localhost as a Unix socket.
db.url=jdbc:mysql://127.0.0.1:3306/sunrise_dental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&characterEncoding=UTF-8&allowMultiQueries=true
db.user=
db.password=
db.pool.size=10

server.port=45321
server.host=0.0.0.0
session.timeout.minutes=30

clinic.name=Sunrise Dental Clinic
clinic.address=42 Galle Road, Colombo 03, Sri Lanka
clinic.phone=+94 11 234 5678
clinic.email=hello@sunrisedental.lk
clinic.vat.rate=0.08

# Notification channels: DEMO writes to the notifications table and a local log.
# Set smtp.enabled=true and fill SMTP details to send real emails.
notify.mode=DEMO
smtp.enabled=false
smtp.host=smtp.gmail.com
smtp.port=587
smtp.user=
smtp.password=
smtp.from=Sunrise Dental Clinic <hello@sunrisedental.lk>
